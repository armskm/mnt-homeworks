---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv21-2
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/disk/pv1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc21-2
spec:
  volumeName: pv21-2
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app21-2
  template:
    metadata:
      labels:
        app: app21-2
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["/bin/sh", "-c"]
        args: ["while true; do date >> /output/date.txt; sleep 5; done"]
        volumeMounts:
        - name: volume21-2
          mountPath: /output
      - name: multitool
        image: wbitt/network-multitool:latest
        command: ["/bin/sh", "-c"]
        args: ["tail -f /input/date.txt"]
        volumeMounts:
        - name: volume21-2
          mountPath: /input
      volumes:
      - name: volume21-2
        persistentVolumeClaim:
          claimName: pvc21-2