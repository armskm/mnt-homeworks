apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc21-3
provisioner: microk8s.io/hostpath
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc21-3
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: sc21-3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app21-3
  template:
    metadata:
      labels:
        app: app21-3
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["/bin/sh", "-c"]
        args: ["while true; do date >> /output/date.txt; sleep 5; done"]
        volumeMounts:
        - name: volume21-3
          mountPath: /output
      - name: multitool
        image: wbitt/network-multitool:latest
        command: ["/bin/sh", "-c"]
        args: ["tail -f /input/date.txt"]
        volumeMounts:
        - name: volume21-3
          mountPath: /input
      volumes:
      - name: volume21-3
        persistentVolumeClaim:
          claimName: pvc21-3