apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-34
spec:
  replicas: 5
  selector:
    matchLabels:
      app: deploy34
  template:
    metadata:
      labels:
        app: deploy34
    spec:
      containers:
      - name: nginx
        image: nginx:1.28
        ports:
        - containerPort: 80
      - name: multitool
        image: wbitt/network-multitool:latest
        env:
          - name: HTTP_PORT
            value: "8080"
        ports:
          - containerPort: 8080
            name: http-port